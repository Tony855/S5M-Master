<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点机器码管理 - 控制台</title>
    <style>
        body { background:#0f172a; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; }
        .container { max-width:900px; margin:0 auto; background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; }
        h2 { margin-top:0; color:#4cc9f0; }
        .header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; border-bottom:1px solid #334155; padding-bottom:15px; }
        button { padding:8px 16px; background:#4361ee; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:bold; }
        table { width:100%; border-collapse:collapse; margin-top:10px; }
        th,td { text-align:left; padding:12px; border-bottom:1px solid #334155; overflow-wrap:anywhere; }
        th { color:#94a3b8; font-size:14px; font-weight:500; }
        td { font-size:14px; }
        .code { font-family:monospace; color:#34d399; background:rgba(52,211,153,.1); padding:2px 6px; border-radius:4px; }
        .status { display:inline-block; border-radius:12px; padding:3px 9px; font-size:12px; }
        .online { color:#34d399; background:rgba(52,211,153,.12); }
        .offline { color:#fca5a5; background:rgba(248,113,113,.12); }
        .empty { text-align:center; color:#94a3b8; padding:40px 0; }
        .error { color:#fca5a5; }
        @media(max-width:600px) { body{padding:8px} .container{padding:12px} th,td{padding:8px 5px;font-size:12px} .header{align-items:flex-start} }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>节点机器码列表</h2>
            <button type="button" onclick="loadAgents()">刷新列表</button>
        </div>
        <table>
            <thead><tr><th>机器码</th><th>授权状态</th><th>Agent 状态</th><th>Mihomo 版本</th><th>SmartDNS 状态</th><th>连接数</th><th>上传 / 下载</th><th>最后心跳</th><th>操作</th></tr></thead>
            <tbody id="agentList"><tr><td colspan="9" class="empty">正在加载...</td></tr></tbody>
        </table>
        </div>
    <div id="configModal" class="container" style="display:none;margin-top:16px;max-width:1200px">
        <div class="header"><h2 id="editorTitle">Agent Mihomo 完整配置</h2><button type="button" onclick="closeEditor()">关闭</button></div>
        <p>此处编辑该 Agent 的完整 Mihomo YAML。保存后 Agent 下次拉取时会整体替换本地配置；若 Mihomo 重载失败，会尝试恢复旧配置。</p>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px">
            <label>TUN 开关 <select id="tunEnabled"><option value="true">开启</option><option value="false">关闭</option></select></label>
            <label>DNS 开关 <select id="dnsEnabled"><option value="true">开启</option><option value="false">关闭</option></select></label>
        </div>
        <label for="dnsServers">DNS nameserver（每行一个地址）</label>
        <textarea id="dnsServers" rows="3" style="width:100%;box-sizing:border-box;margin:8px 0 14px;background:#0f172a;color:#f8fafc;border:1px solid #475569;border-radius:6px;padding:10px" placeholder="https://dns.alidns.com/dns-query"></textarea>
        <label for="configYaml">完整 Mihomo YAML</label>
        <textarea id="configYaml" spellcheck="false" rows="28" style="width:100%;box-sizing:border-box;margin:8px 0 14px;background:#020617;color:#dbeafe;border:1px solid #475569;border-radius:6px;padding:12px;font:13px/1.5 ui-monospace,SFMono-Regular,monospace"></textarea>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" onclick="applyQuickSettings()">将上方 TUN/DNS 设置写入 YAML</button><button type="button" onclick="saveNodeConfig()">保存并下发</button><span id="editorMessage"></span></div>
    </div>
    <div id="smartdnsModal" class="container" style="display:none;margin-top:16px;max-width:1200px">
        <div class="header"><h2 id="smartdnsTitle">SmartDNS 配置</h2><button type="button" onclick="closeSmartDNS()">关闭</button></div>
        <p>此处配置只作用于包含 SmartDNS 的独立 Agent 镜像。主控会先校验配置格式，再通过 Agent 的 WebSocket 下发；Agent 会在本地预检、备份旧配置、重载并回报结果。</p>
        <div id="smartdnsStatus" style="margin-bottom:10px;color:#94a3b8"></div>
        <label for="smartdnsConfig">SmartDNS 配置（最多 8 KiB）</label>
        <textarea id="smartdnsConfig" spellcheck="false" rows="16" style="width:100%;box-sizing:border-box;margin:8px 0 14px;background:#020617;color:#dbeafe;border:1px solid #475569;border-radius:6px;padding:12px;font:13px/1.5 ui-monospace,SFMono-Regular,monospace"></textarea>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" onclick="saveSmartDNS()">校验并下发 SmartDNS 配置</button><span id="smartdnsMessage"></span></div>
    </div>
    <script>
        const TOKEN_KEY = 's5m_next_token';
        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        function formatTime(seconds) {
            if (!seconds) return '从未上报';
            const date = new Date(seconds * 1000);
            return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleString();
        }
        async function loadAgents() {
            const tbody = document.getElementById('agentList');
            tbody.innerHTML = '<tr><td colspan="9" class="empty">正在加载...</td></tr>';
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty error">请先登录 S5M 主控台，再打开本页面。</td></tr>';
                return;
            }
            try {
                const res = await fetch('/api/v1/agents', { headers: { Authorization: 'Bearer ' + token } });
                if (res.status === 401) throw new Error('登录已失效，请返回主控台重新登录');
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.error || ('HTTP ' + res.status));
                }
                const data = await res.json();
                const entries = Object.entries(data || {});
                if (!entries.length) {
                    tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无已授权机器码。</td></tr>';
                    return;
                }
                const now = Date.now() / 1000;
                tbody.innerHTML = entries.map(([code, info]) => {
                    const seen = Number(info && info.last_seen || 0);
                    const ageSeconds = now - seen;
                    const online = seen > 0 && ageSeconds >= 0 && ageSeconds <= 90;
                    const status = info && info.status || {};
                    const healthy = status.mihomo_healthy === true;
                    const version = status.mihomo_version || '未知';
                    const smartdnsAvailable = status.smartdns_available === true;
                    const smartdnsRunning = status.smartdns_running === true;
                    const smartdnsDNSHealthy = status.smartdns_dns_healthy === true;
                    const smartdnsStatus = !smartdnsAvailable ? '未安装（标准镜像）' : (!online ? 'Agent 离线（状态过期）' : (smartdnsRunning ? (smartdnsDNSHealthy ? '运行中 / DNS 正常' : '进程运行 / DNS 异常') : '异常'));
                    const smartdnsClass = smartdnsAvailable && !online ? 'offline' : (smartdnsRunning && smartdnsDNSHealthy ? 'online' : (smartdnsAvailable ? 'error' : 'offline'));
                    const connections = Number(status.connections || 0);
                    const up = Number(status.upload_speed || 0);
                    const down = Number(status.download_speed || 0);
                    const fmt = value => {
                        if (!Number.isFinite(value) || value <= 0) return '0 B/s';
                        const units = ['B/s','KB/s','MB/s','GB/s'];
                        const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
                        return (value / Math.pow(1024, index)).toFixed(1) + ' ' + units[index];
                    };
                    return '<tr><td><span class="code">' + esc(code) + '</span></td>' +
                        '<td>' + (info && info.authorized ? '已授权' : '未授权') + '</td>' +
                        '<td><span class="status ' + (online && healthy ? 'online' : 'offline') + '">' + (online ? (healthy ? '在线 / 正常' : '在线 / 异常') : '离线') + '</span></td>' +
                        '<td>' + esc(version) + '</td>' +
                        '<td><span class="status ' + smartdnsClass + '">' + esc(smartdnsStatus) + '</span>' +
                        (status.smartdns_version ? '<div>' + esc(status.smartdns_version) + '</div>' : '') +
                        (status.smartdns_last_error ? '<div class="error">' + esc(status.smartdns_last_error) + '</div>' : '') +
                        (info.desired_smartdns_config_sha256 ? '<div class="' + (String(status.smartdns_config_sha256 || '') === String(info.desired_smartdns_config_sha256) ? 'online' : 'error') + '">' + (String(status.smartdns_config_sha256 || '') === String(info.desired_smartdns_config_sha256) ? '配置已同步' : '配置待应用') + '</div>' : '') + '</td>' +
                        '<td>' + esc(connections) + '</td>' +
                        '<td>↑ ' + esc(fmt(up)) + ' / ↓ ' + esc(fmt(down)) + '</td>' +
                        '<td>' + esc(formatTime(seen)) + (info.desired_config_sha256 ? '<div class="' + (String(status.config_sha256 || '') === String(info.desired_config_sha256) ? 'online' : 'error') + '">' + (String(status.config_sha256 || '') === String(info.desired_config_sha256) ? '配置已同步' : '配置待应用') + '</div>' : '') + (status.last_error ? '<div class="error">' + esc(status.last_error) + '</div>' : '') + (info.command_result ? '<div>内核更新：' + esc(info.command_result.status || '') + ' ' + esc(info.command_result.message || '') + '</div>' : '') + '</td>' +
                        '<td><button class="btn-copy" type="button" data-code="' + esc(code) + '">复制机器码</button> <button type="button" data-edit="' + esc(code) + '">编辑配置</button> ' +
                        (smartdnsAvailable ? '<button type="button" data-smartdns="' + esc(code) + '">SmartDNS 配置</button> ' : '') +
                        '<button type="button" data-update="' + esc(code) + '">更新内核</button></td></tr>';
                }).join('');
                tbody.querySelectorAll('button[data-code]').forEach(button => button.addEventListener('click', () => copyText(button.dataset.code)));
                tbody.querySelectorAll('button[data-edit]').forEach(button => button.addEventListener('click', () => openEditor(button.dataset.edit)));
                tbody.querySelectorAll('button[data-update]').forEach(button => button.addEventListener('click', () => queueMihomoUpdate(button.dataset.update)));
                tbody.querySelectorAll('button[data-smartdns]').forEach(button => button.addEventListener('click', () => openSmartDNS(button.dataset.smartdns)));
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty error">加载失败：' + esc(e.message) + '</td></tr>';
            }
        }
        async function copyText(value) {
            try { await navigator.clipboard.writeText(value); alert('机器码已复制：' + value); }
            catch (_) { window.prompt('请复制机器码：', value); }
        }

        let editingCode = '';
        async function editorAPI(path, options = {}) {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) throw new Error('请先登录主控台');
            const headers = { Authorization: 'Bearer ' + token };
            if (options.body) headers['Content-Type'] = 'application/json';
            const res = await fetch(path, { ...options, headers });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(body.error || body.message || ('HTTP ' + res.status));
            return body;
        }
        async function openEditor(code) {
            editingCode = code;
            document.getElementById('editorTitle').textContent = 'Agent Mihomo 完整配置：' + code;
            document.getElementById('editorMessage').textContent = '正在读取配置...';
            document.getElementById('configModal').style.display = 'block';
            try {
                const data = await sendAgentWSControl({ type: 'node.config.get', machine_code: code });
                const yamlText = data.yaml || data.config_yaml || '';
                if (!yamlText) throw new Error('没有保存的节点配置。请让 Agent 先成功连接主控端，再打开编辑器。');
                document.getElementById('configYaml').value = yamlText;
                syncControlsFromYaml();
                document.getElementById('editorMessage').textContent = '配置已加载';
                document.getElementById('configModal').scrollIntoView({behavior:'smooth',block:'start'});
            } catch (e) { document.getElementById('editorMessage').textContent = '读取失败：' + e.message; }
        }
        function closeEditor() { document.getElementById('configModal').style.display = 'none'; editingCode = ''; }
        function blockLines(yaml, name) {
            const lines = yaml.split(/\r?\n/);
            const start = lines.findIndex(line => line.startsWith(name + ':'));
            if (start < 0) return [];
            let end = start + 1;
            while (end < lines.length && (lines[end].trim() === '' || /^\s/.test(lines[end]) || /^#/.test(lines[end]))) end++;
            return lines.slice(start, end);
        }
        function boolValue(lines, key) {
            const line = lines.find(line => new RegExp('^\\s+' + key + ':\\s*(true|false)\\b', 'i').test(line));
            return line ? /:\s*true\b/i.test(line) : false;
        }
        function syncControlsFromYaml() {
            const yaml = document.getElementById('configYaml').value;
            document.getElementById('tunEnabled').value = String(boolValue(blockLines(yaml, 'tun'), 'enable'));
            const dns = blockLines(yaml, 'dns');
            document.getElementById('dnsEnabled').value = String(boolValue(dns, 'enable'));
            const i = dns.findIndex(line => /^\s{2}nameserver:\s*$/.test(line));
            const values = [];
            if (i >= 0) for (let n=i+1; n<dns.length && /^\s{4}-\s*/.test(dns[n]); n++) values.push(dns[n].replace(/^\s{4}-\s*/, '').replace(/^['"]|['"]$/g, ''));
            document.getElementById('dnsServers').value = values.join('\n');
        }
        function replaceBool(lines, block, key, value) {
            let start = lines.findIndex(line => line.startsWith(block + ':'));
            if (start < 0) { lines.push(block + ':', '  ' + key + ': ' + value); return; }
            let end = start + 1;
            while (end < lines.length && (lines[end].trim() === '' || /^\s/.test(lines[end]) || /^#/.test(lines[end]))) end++;
            let idx = -1;
            for (let i=start+1; i<end; i++) if (new RegExp('^\\s+' + key + ':').test(lines[i])) { idx=i; break; }
            if (idx >= 0) lines[idx] = '  ' + key + ': ' + value;
            else lines.splice(start+1, 0, '  ' + key + ': ' + value);
        }
        function replaceNameservers(lines, names) {
            let start = lines.findIndex(line => /^dns:\s*$/.test(line));
            if (start < 0) { lines.push('dns:', '  enable: ' + document.getElementById('dnsEnabled').value); start = lines.length-2; }
            let end = start + 1;
            while (end < lines.length && (lines[end].trim() === '' || /^\s/.test(lines[end]) || /^#/.test(lines[end]))) end++;
            let idx = -1;
            for (let i=start+1; i<end; i++) if (/^\s{2}nameserver:\s*$/.test(lines[i])) { idx=i; break; }
            const entries = names.map(x => x.trim()).filter(Boolean).map(x => '    - ' + (/[:#"'{}\[\],\s]/.test(x) ? JSON.stringify(x) : x));
            if (idx < 0) lines.splice(end, 0, '  nameserver:', ...entries);
            else {
                let stop=idx+1;
                while (stop<end && /^\s{4}-/.test(lines[stop])) stop++;
                lines.splice(idx+1, stop-idx-1, ...entries);
            }
        }
        function applyQuickSettings() {
            const lines = document.getElementById('configYaml').value.split(/\r?\n/);
            replaceBool(lines, 'tun', 'enable', document.getElementById('tunEnabled').value);
            replaceBool(lines, 'dns', 'enable', document.getElementById('dnsEnabled').value);
            replaceNameservers(lines, document.getElementById('dnsServers').value.split(/\r?\n/));
            document.getElementById('configYaml').value = lines.join('\n') + '\n';
            document.getElementById('editorMessage').textContent = 'TUN/DNS 设置已写入编辑器，请检查后保存';
        }
        async function saveNodeConfig() {
            if (!editingCode) return;
            const message = document.getElementById('editorMessage');
            message.textContent = '正在校验并保存...';
            try {
                const result = await sendAgentWSControl({ type: 'node.config.save', machine_code: editingCode, config_yaml: document.getElementById('configYaml').value });
                message.textContent = result.message || '已保存；Agent 将在下一次拉取时应用';
            } catch (e) { message.textContent = '保存失败：' + e.message; }
        }


        let smartdnsEditingCode = '';
        async function openSmartDNS(code) {
            smartdnsEditingCode = code;
            document.getElementById('smartdnsTitle').textContent = 'SmartDNS 配置：' + code;
            document.getElementById('smartdnsMessage').textContent = '正在读取...';
            document.getElementById('smartdnsModal').style.display = 'block';
            try {
                const data = await sendAgentWSControl({ type: 'agent.smartdns.get', machine_code: code });
                document.getElementById('smartdnsConfig').value = data.config || '';
                const state = !data.available ? '未上报/未安装' : (!data.running ? '进程异常' : (data.dns_healthy ? '运行中 / DNS 正常' : '运行中 / DNS 异常'));
                document.getElementById('smartdnsStatus').textContent =
                    '运行状态：' + state + '；版本：' + (data.version || '未知') +
                    '；配置同步：' + (data.desired_config_sha256 && data.desired_config_sha256 === data.reported_config_sha256 ? '已同步' : '待应用/未上报') +
                    '；当前上报配置 SHA-256：' + (data.reported_config_sha256 || '尚未上报') +
                    (data.last_error ? '；错误：' + data.last_error : '');
                document.getElementById('smartdnsMessage').textContent = '配置已加载';
                document.getElementById('smartdnsModal').scrollIntoView({behavior:'smooth',block:'start'});
            } catch (e) {
                document.getElementById('smartdnsMessage').textContent = '读取失败：' + e.message;
            }
        }
        function closeSmartDNS() {
            document.getElementById('smartdnsModal').style.display = 'none';
            smartdnsEditingCode = '';
        }
        async function saveSmartDNS() {
            if (!smartdnsEditingCode) return;
            const message = document.getElementById('smartdnsMessage');
            message.textContent = '正在校验并排队...';
            try {
                const result = await sendAgentWSControl({
                    type: 'agent.smartdns.configure',
                    machine_code: smartdnsEditingCode,
                    config: document.getElementById('smartdnsConfig').value
                });
                message.textContent = result.message || '配置命令已排队';
            } catch (e) {
                message.textContent = '下发失败：' + e.message;
            }
        }

        async function queueMihomoUpdate(code) {
            try {
                const info = await sendAgentWSControl({ type: 'agent.mihomo.update-info', machine_code: code }, 60000);
                const current = info.current_version || '尚未上报';
                const message = '目标 Agent：' + code + '\\n架构：' + info.arch + '\\n当前版本：' + current + '\\n官方最新稳定版：' + info.latest_version + '\\n发行文件：' + info.asset_name + '\\nSHA-256 已由主控从官方文件自动计算。\\n\\n确认排队一键更新？Agent 会再次校验文件并测试新内核。';
                if (!window.confirm(message)) return;
                const result = await sendAgentWSControl({ type: 'agent.mihomo.update', machine_code: code, version: info.latest_version, sha256: info.sha256 });
                alert(result.message || '更新命令已排队');
            } catch (e) {
                alert('无法准备更新：' + e.message);
            }
        }

        let agentsSocket = null;
        let agentsConnecting = false;
        let agentsStopped = false;
        let agentsGeneration = 0;
        let agentsRetryTimer = null;
        const agentWSRequests = new Map();
        function sendAgentWSControl(payload, timeoutMs = 15000) {
            return new Promise((resolve, reject) => {
                const socket = agentsSocket;
                if (!socket || socket.readyState !== WebSocket.OPEN) { reject(new Error('WebSocket 未连接')); return; }
                const requestId = (window.crypto && typeof window.crypto.randomUUID === 'function') ? window.crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2);
                const timer = setTimeout(() => { agentWSRequests.delete(requestId); reject(new Error('WebSocket 操作超时')); }, timeoutMs);
                agentWSRequests.set(requestId, { resolve: value => { clearTimeout(timer); resolve(value); }, reject: error => { clearTimeout(timer); reject(error); } });
                try { socket.send(JSON.stringify({ ...payload, request_id: requestId })); } catch (error) { clearTimeout(timer); agentWSRequests.delete(requestId); reject(error); }
            });
        }
        function rejectPendingAgentWSRequests(message) {
            for (const [requestId, pending] of agentWSRequests.entries()) {
                agentWSRequests.delete(requestId);
                pending.reject(new Error(message));
            }
        }
        function connectAgentEvents() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token || agentsSocket || agentsConnecting || agentsStopped) return;
            agentsConnecting = true;
            const generation = ++agentsGeneration;
            const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
            fetch('/api/v1/events/ticket', {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + token }
            }).then(async res => {
                const body = await res.json().catch(() => ({}));
                if (!res.ok || !body.ticket) throw new Error(body.error || '实时通道授权失败');
                if (generation !== agentsGeneration || agentsStopped || !localStorage.getItem(TOKEN_KEY)) return;
                const socket = new WebSocket(scheme + '//' + location.host + '/api/v1/events/ws?ticket=' + encodeURIComponent(body.ticket));
                agentsSocket = socket;
                socket.onopen = () => {
                    if (generation !== agentsGeneration || agentsStopped || !localStorage.getItem(TOKEN_KEY) || agentsSocket !== socket) {
                        try { socket.close(); } catch (_) {}
                        return;
                    }
                    agentsConnecting = false;
                };
                socket.onmessage = event => {
                    if (generation !== agentsGeneration || agentsStopped || !localStorage.getItem(TOKEN_KEY) || agentsSocket !== socket) return;
                    let message;
                    try { message = JSON.parse(event.data); } catch (_) { return; }
                    if (message.type === 'request.result' && message.request_id) {
                        const pending = agentWSRequests.get(message.request_id);
                        if (pending) { agentWSRequests.delete(message.request_id); if (message.ok) pending.resolve(message); else pending.reject(new Error(message.error || 'WebSocket 操作失败')); }
                        return;
                    }
                    if (message.type === 'agent.binding.revoked' ||
                        message.type === 'agent.binding.updated' ||
                        message.type === 'agent.command.updated' ||
                        message.type === 'agent.command.queued') {
                        loadAgents();
                    }
                };
                socket.onclose = () => {
                    if (generation !== agentsGeneration) return;
                    const wasCurrentSocket = agentsSocket === socket;
                    if (wasCurrentSocket) {
                        agentsSocket = null;
                        rejectPendingAgentWSRequests('实时通道已断开，操作结果未确认；请重新进入页面刷新状态后再决定是否重试');
                    }
                    agentsConnecting = false;
                    if (!wasCurrentSocket || agentsStopped || !localStorage.getItem(TOKEN_KEY)) return;
                    clearTimeout(agentsRetryTimer);
                    agentsRetryTimer = setTimeout(connectAgentEvents, 3000);
                };
                socket.onerror = () => { try { socket.close(); } catch (_) {} };
            }).catch(() => {
                if (generation !== agentsGeneration) return;
                agentsConnecting = false;
                if (agentsStopped || !localStorage.getItem(TOKEN_KEY)) return;
                clearTimeout(agentsRetryTimer);
                agentsRetryTimer = setTimeout(connectAgentEvents, 3000);
            });
        }
        window.addEventListener('pagehide', () => {
            agentsStopped = true;
            agentsConnecting = false;
            agentsGeneration++;
            clearTimeout(agentsRetryTimer);
            agentsRetryTimer = null;
            rejectPendingAgentWSRequests('页面已离开，实时操作结果未确认；重新进入后请刷新状态');
            if (agentsSocket) {
                const socket = agentsSocket;
                agentsSocket = null;
                socket.onclose = null;
                try { socket.close(); } catch (_) {}
            }
        });
        window.addEventListener('load', () => {
            loadAgents();
            connectAgentEvents();
        });
    </script>
</body>
</html>
