<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点机器码管理 - 控制台</title>
    <style>
        body { background:#0f172a; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; }
        .container { max-width:900px; margin:0 auto; background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; }
        h2 { margin-top:0; color:#4cc9f0; }
        .header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; border-bottom:1px solid #334155; padding-bottom:15px; }
        button { padding:8px 16px; background:#4361ee; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:bold; }
        table { width:100%; border-collapse:collapse; margin-top:10px; }
        th,td { text-align:left; padding:12px; border-bottom:1px solid #334155; overflow-wrap:anywhere; }
        th { color:#94a3b8; font-size:14px; font-weight:500; }
        td { font-size:14px; }
        .code { font-family:monospace; color:#34d399; background:rgba(52,211,153,.1); padding:2px 6px; border-radius:4px; }
        .status { display:inline-block; border-radius:12px; padding:3px 9px; font-size:12px; }
        .online { color:#34d399; background:rgba(52,211,153,.12); }
        .offline { color:#fca5a5; background:rgba(248,113,113,.12); }
        .empty { text-align:center; color:#94a3b8; padding:40px 0; }
        .error { color:#fca5a5; }
        @media(max-width:600px) { body{padding:8px} .container{padding:12px} th,td{padding:8px 5px;font-size:12px} .header{align-items:flex-start} }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>节点机器码列表</h2>
            <button type="button" onclick="loadAgents()">刷新列表</button>
        </div>
        <table>
            <thead><tr><th>机器码</th><th>授权状态</th><th>Agent 状态</th><th>Mihomo 版本</th><th>连接数</th><th>上传 / 下载</th><th>最后心跳</th><th>操作</th></tr></thead>
            <tbody id="agentList"><tr><td colspan="8" class="empty">正在加载...</td></tr></tbody>
        </table>
    </div>
    <script>
        const TOKEN_KEY = 's5m_next_token';
        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        function formatTime(seconds) {
            if (!seconds) return '从未上报';
            const date = new Date(seconds * 1000);
            return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleString();
        }
        async function loadAgents() {
            const tbody = document.getElementById('agentList');
            tbody.innerHTML = '<tr><td colspan="8" class="empty">正在加载...</td></tr>';
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty error">请先登录 S5M 主控台，再打开本页面。</td></tr>';
                return;
            }
            try {
                const res = await fetch('/api/v1/agents', { headers: { Authorization: 'Bearer ' + token } });
                if (res.status === 401) throw new Error('登录已失效，请返回主控台重新登录');
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.error || ('HTTP ' + res.status));
                }
                const data = await res.json();
                const entries = Object.entries(data || {});
                if (!entries.length) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无已授权机器码。</td></tr>';
                    return;
                }
                const now = Date.now() / 1000;
                tbody.innerHTML = entries.map(([code, info]) => {
                    const seen = Number(info && info.last_seen || 0);
                    const online = seen > 0 && now - seen <= 90;
                    const status = info && info.status || {};
                    const healthy = status.mihomo_healthy === true;
                    const version = status.mihomo_version || '未知';
                    const connections = Number(status.connections || 0);
                    const up = Number(status.upload_speed || 0);
                    const down = Number(status.download_speed || 0);
                    const fmt = value => {
                        if (!Number.isFinite(value) || value <= 0) return '0 B/s';
                        const units = ['B/s','KB/s','MB/s','GB/s'];
                        const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
                        return (value / Math.pow(1024, index)).toFixed(1) + ' ' + units[index];
                    };
                    return '<tr><td><span class="code">' + esc(code) + '</span></td>' +
                        '<td>' + (info && info.authorized ? '已授权' : '未授权') + '</td>' +
                        '<td><span class="status ' + (online && healthy ? 'online' : 'offline') + '">' + (online ? (healthy ? '在线 / 正常' : '在线 / 异常') : '离线') + '</span></td>' +
                        '<td>' + esc(version) + '</td><td>' + esc(connections) + '</td>' +
                        '<td>↑ ' + esc(fmt(up)) + ' / ↓ ' + esc(fmt(down)) + '</td>' +
                        '<td>' + esc(formatTime(seen)) + (status.last_error ? '<div class="error">' + esc(status.last_error) + '</div>' : '') + '</td>' +
                        '<td><button class="btn-copy" type="button" data-code="' + esc(code) + '">复制机器码</button></td></tr>';
                }).join('');
                tbody.querySelectorAll('button[data-code]').forEach(button => button.addEventListener('click', () => copyText(button.dataset.code)));
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty error">加载失败：' + esc(e.message) + '</td></tr>';
            }
        }
        async function copyText(value) {
            try { await navigator.clipboard.writeText(value); alert('机器码已复制：' + value); }
            catch (_) { window.prompt('请复制机器码：', value); }
        }
        window.addEventListener('load', loadAgents);
    </script>
</body>
</html>
