<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S5M Proxy Service</title>
<link rel="stylesheet" href="/vendor/element-plus.css">
<style>
  :root { --brand: #4361ee; --brand-2: #4cc9f0; }
  * { box-sizing: border-box; } 
  html, body { height: 100%; margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f7f9; }
  
  /* 桌面端布局 */
  .layout { height: 100vh; }
  .aside { width: 220px; background: #0f172a; color: #fff; display: flex; flex-direction: column; }
  .logo { padding: 20px; font-size: 18px; font-weight: bold; color: var(--brand-2); border-bottom: 1px solid rgba(255,255,255,0.1); }
  .main { padding: 20px; overflow-y: auto; }
  .panel { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); }

  /* 机器码列表样式 */
  .agent-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid #eee; }
  .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .agent-code { font-weight: bold; font-size: 14px; color: #333; word-break: break-all; }
  .agent-token { background: #f8f8f8; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #666; word-break: break-all; }

  /* === 移动端响应式覆盖 === */
  @media (max-width: 768px) {
    .layout { flex-direction: column; height: auto; min-height: 100vh; }
    .aside { width: 100%; flex-direction: row; align-items: center; overflow-x: auto; padding: 0; }
    .logo { padding: 15px; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.1); font-size: 16px; white-space: nowrap; }
    .aside .el-menu { display: flex; flex-direction: row; border: none; background: transparent; }
    .aside .el-menu-item { color: #cbd5e1; height: 50px; line-height: 50px; padding: 0 15px; border-bottom: none !important; }
    .aside .el-menu-item.is-active { color: #fff; background: rgba(255,255,255,0.1); border-left: 3px solid var(--brand-2) !important; }
    .main { padding: 15px; }
    .panel { padding: 15px; }
    .agent-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .agent-actions { display: flex; gap: 8px; width: 100%; }
    .agent-actions button { flex: 1; }
  }
</style>
</head>
<body>
<div id="app" v-cloak>
  <el-container class="layout">
    <!-- 侧边栏/顶部菜单 -->
    <el-aside class="aside">
      <div class="logo">S5M Proxy</div>
      <el-menu :default-active="page" @select="v => page = v" style="border:none;background:transparent;">
        <el-menu-item index="dashboard">仪表盘</el-menu-item>
        <el-menu-item index="instances">远端节点</el-menu-item>
        <el-menu-item index="config">配置管理</el-menu-item>
      </el-menu>
    </el-aside>

    <!-- 主内容区 -->
    <el-main class="main">
      <!-- 仪表盘 -->
      <div v-if="page === 'dashboard'">
        <div class="panel">
          <h3 style="margin-top:0;">欢迎使用 S5M 控制台</h3>
          <p style="color:#666;">请前往 <b>远端节点</b> 管理您的机器码。</p>
        </div>
      </div>

      <!-- 远端节点 -->
      <div v-if="page === 'instances'">
        <div class="panel">
          <h3 style="margin-top:0;">生成专属机器码 Token</h3>
          <div style="display:flex; gap:10px; margin-bottom: 20px;">
            <input type="text" id="generate-mc-input" placeholder="输入机器码 (Machine Code)..." style="flex:1; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; outline:none;">
            <el-button type="primary" onclick="window.generateAgentToken()">生成并绑定</el-button>
          </div>
          <div id="generate-result" style="display:none; padding: 12px; background: #f0f9eb; border: 1px solid #e1f3d8; color: #67c23a; border-radius: 4px; margin-bottom: 20px; word-break: break-all;">
            专属 Token: <strong id="generated-token-text" style="font-family: monospace; margin-right: 10px;"></strong>
            <el-button size="small" type="success" onclick="window.safeCopy(document.getElementById('generated-token-text').innerText)">复制</el-button>
          </div>
        </div>

        <div class="panel">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">已注册节点机器码</h3>
            <el-button size="small" onclick="window.loadAgentsData()">刷新列表</el-button>
          </div>
          <div id="agent-list-body">
            <div style="text-align:center; padding:20px; color:#999;">正在加载...</div>
          </div>
        </div>
      </div>

      <!-- 配置管理 -->
      <div v-if="page === 'config'">
        <div class="panel">
          <h3 style="margin-top:0;">客户端订阅链接</h3>
          <div style="display:flex; align-items:center; gap:10px;">
            <el-input v-model="subUrl" readonly>
              <template #prepend>订阅地址</template>
            </el-input>
          </div>
        </div>
        <div class="panel">
          <h3 style="margin-top:0;">当前生成的 YAML</h3>
          <pre style="background:#0f172a; color:#e2e8f0; padding:15px; border-radius:8px; overflow-x:auto;">暂无配置</pre>
        </div>
      </div>
    </el-main>
  </el-container>
</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.js"></script>
<script>
  // 1. 启动 Vue
  const { createApp } = Vue;
  createApp({
    data() {
      return { page: 'instances', subUrl: 'http://foodflow.v2net.cc/api/sub' }
    },
    mounted() {
      // 页面加载完成后自动加载机器码
      setTimeout(() => window.loadAgentsData(), 100);
    }
  }).use(ElementPlus).mount('#app');

  // 2. 通用复制
  window.safeCopy = function(text) {
    if(!text) return;
    var t = document.createElement("textarea"); t.value = text; t.style.position = 'fixed'; t.style.left = '-9999px';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); alert('复制成功'); } catch (e) { alert('复制失败'); }
    document.body.removeChild(t);
  };

  // 3. 生成 Token
  window.generateAgentToken = function() {
    var mc = document.getElementById('generate-mc-input').value.trim();
    if (!mc) return alert('请输入机器码');
    var token = localStorage.getItem('s5m_next_token');
    if (!token) return alert('请先登录主控台');

    var btn = event.target; btn.innerText = '生成中...'; btn.disabled = true;
    fetch('/api/v1/agents/generate', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, 
      body: JSON.stringify({ machine_code: mc })
    }).then(r => r.json()).then(d => {
      btn.innerText = '生成并绑定'; btn.disabled = false;
      if (d.token) {
        document.getElementById('generated-token-text').innerText = d.token;
        document.getElementById('generate-result').style.display = 'block';
        window.loadAgentsData();
      } else { alert(d.error || '失败'); }
    }).catch(e => { btn.innerText = '生成并绑定'; btn.disabled = false; alert('网络错误'); });
  };

  // 4. 加载列表
  window.loadAgentsData = function() {
    var box = document.getElementById('agent-list-body');
    if (!box) return;
    box.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">加载中...</div>';
    
    var token = localStorage.getItem('s5m_next_token');
    fetch('/api/v1/agents', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => {
        if (r.status === 401) throw new Error('未登录');
        return r.json();
      })
      .then(data => {
        var keys = Object.keys(data);
        if (!keys.length) { 
          box.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">暂无数据</div>'; 
          return; 
        }
        var h = '';
        keys.forEach(k => {
          var v = data[k];
          h += '<div class="agent-item">';
          h += '<div class="agent-header">';
          h += '<span class="agent-code">' + k + '</span>';
          h += '<div class="agent-actions">';
          h += '<button onclick="safeCopy(\'' + v + '\')" style="padding:6px 12px;background:#67C23A;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">复制 Token</button>';
          h += '<button onclick="deleteAgent(\'' + k + '\')" style="padding:6px 12px;background:#F56C6C;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">删除</button>';
          h += '</div></div>';
          h += '<div class="agent-token">' + v + '</div>';
          h += '</div>';
        });
        box.innerHTML = h;
      })
      .catch(e => {
        if (e.message === '未登录') {
          box.innerHTML = '<div style="text-align:center;padding:20px;color:#E6A23C;">未登录或登录已过期，请先登录主控台</div>';
        } else {
          box.innerHTML = '<div style="text-align:center;padding:20px;color:red;">加载失败: ' + e.message + '</div>';
        }
      });
  };

  // 5. 删除
  window.deleteAgent = function(code) {
    if (!confirm('确定删除该机器码？')) return;
    var token = localStorage.getItem('s5m_next_token');
    fetch('/api/v1/agents?code=' + encodeURIComponent(code), { 
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token } 
    }).then(r => {
      if(r.status === 401) throw new Error('请先登录');
      return r.json();
    }).then(() => {
      window.loadAgentsData();
    }).catch(e => alert(e.message));
  };
</script>
</body>
</html>
