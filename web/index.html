<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S5M Proxy Service</title>
<link rel="stylesheet" href="/vendor/element-plus.css">
<style>
  :root{--brand:#4361ee;--brand-2:#4cc9f0; --bg: #f5f7fa;}
  *{box-sizing:border-box} html,body{height:100%;margin:0; background: var(--bg); font-family: -apple-system, sans-serif;}
  .layout { height: 100vh; }
  .aside { width: 220px; background: #fff; border-right: 1px solid #eee; display: flex; flex-direction: column; }
  .logo { padding: 20px; font-size: 18px; font-weight: bold; color: #303133; border-bottom: 1px solid #eee; }
  .main { padding: 20px; overflow-y: auto; }
  .card-panel { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); }
  .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); display: flex; flex-direction: column; gap: 10px; }
  .stat-title { color: #909399; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .stat-value { font-size: 24px; font-weight: bold; color: #303133; }

  /* 移动端：侧边栏变顶部导航 */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .aside { width: 100%; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid #eee; }
    .logo { display: none; }
    .aside .el-menu { display: flex; flex-direction: row; border: none; }
    .aside .el-menu-item { border-bottom: none !important; height: 50px; line-height: 50px; }
    .main { padding: 15px; }
    .grid-cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 登录页 -->
  <div v-if="!token" style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a;">
    <div style="width: 100%; max-width: 400px; background: #fff; padding: 30px; border-radius: 12px;">
      <h3 style="text-align: center; margin-top: 0;">管理员登录</h3>
      <el-input v-model="loginUser" placeholder="账号" style="margin-bottom: 15px;"></el-input>
      <el-input v-model="loginPass" type="password" placeholder="密码" show-password style="margin-bottom: 20px;" @keyup.enter="doLogin"></el-input>
      <el-button type="primary" style="width: 100%;" @click="doLogin" :loading="loggingIn">登录</el-button>
    </div>
  </div>

  <!-- 主界面 -->
  <el-container v-else class="layout">
    <!-- 侧边栏 -->
    <el-aside class="aside">
      <div class="logo">S5M Proxy</div>
      <el-menu :default-active="page" @select="switchPage" style="border: none;">
        <el-menu-item index="dashboard">仪表盘</el-menu-item>
        <el-menu-item index="proxies">代理管理</el-menu-item>
        <el-menu-item index="instances">远端节点</el-menu-item>
        <el-menu-item index="config">配置管理</el-menu-item>
      </el-menu>
    </el-aside>

    <!-- 主内容区 -->
    <el-main class="main">
      <div class="top-bar">
        <span style="color: #666;">👤 admin</span>
        <el-button size="small" @click="logout">退出登录</el-button>
      </div>

      <!-- 仪表盘 -->
      <div v-if="page === 'dashboard'">
        <div class="grid-cards">
          <div class="stat-card">
            <div class="stat-title">💻 Mihomo 内核</div>
            <div class="stat-value">v1.19.32</div>
            <el-button size="small" type="primary" style="margin-top: auto;">更新内核</el-button>
          </div>
          <div class="stat-card">
            <div class="stat-title" style="color: #f56c6c;">⬇ 实时下载</div>
            <div class="stat-value">0 B/s</div>
          </div>
          <div class="stat-card">
            <div class="stat-title" style="color: #8e44ad;">⬆ 实时上传</div>
            <div class="stat-value">0 B/s</div>
          </div>
          <div class="stat-card">
            <div class="stat-title" style="color: #409eff;">🔗 活跃连接</div>
            <div class="stat-value">1</div>
          </div>
          <div class="stat-card">
            <div class="stat-title" style="color: #67c23a;">⚡ 启用节点</div>
            <div class="stat-value">4 / 4</div>
          </div>
        </div>
      </div>

      <!-- 远端节点 -->
      <div v-if="page === 'instances'">
        <div class="card-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">已注册节点机器码</h3>
            <el-button type="primary" size="small" @click="loadAgentsData">刷新列表</el-button>
          </div>
          <table style="width: 100%; text-align: left; border-collapse: collapse; font-size: 14px;">
            <thead>
              <tr style="background: #f5f7fa; color: #909399;">
                <th style="padding: 12px; border-bottom: 1px solid #ebeef5;">机器码</th>
                <th style="padding: 12px; border-bottom: 1px solid #ebeef5;">Token</th>
                <th style="padding: 12px; border-bottom: 1px solid #ebeef5;">操作</th>
              </tr>
            </thead>
            <tbody id="agent-list-body">
              <tr><td colspan="3" style="padding: 20px; text-align: center; color: #999;">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 代理管理 -->
      <div v-if="page === 'proxies'">
        <div class="card-panel">
          <h3>代理列表</h3>
          <p style="color: #999;">
<div v-if="proxies.length === 0" style="color: #999; padding: 20px;">暂无代理节点</div>
<div v-else>
  <div v-for="p in proxies" :key="p.id" style="padding: 10px 0; border-bottom: 1px solid #eee;">
    <strong>{{ p.name }}</strong> <span style="color:#999;font-size:12px;">{{ p.type }} - {{ p.server }}</span>
  </div>
</div>
</p>
        </div>
      </div>

      <!-- 配置管理 -->
      <div v-if="page === 'config'">
        <div class="card-panel">
          <h3>客户端订阅链接</h3>
          <el-input v-model="subUrl" readonly style="margin-bottom: 20px;">
            <template #prepend>订阅地址</template>
          </el-input>
          <h3>发布全局配置</h3>
          <el-input v-model="configYaml" type="textarea" :rows="10" placeholder="在此粘贴或编写 Mihomo 配置..."></el-input>
          <el-button type="primary" style="margin-top: 15px; width: 100%;" @click="publishConfig">保存并下发</el-button>
        </div>
      </div>

    </el-main>
  </el-container>
</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.js"></script>
<script>
  const { createApp, ref, onMounted } = Vue;
  
  createApp({
    setup() {
      const page = ref('dashboard');
      const token = ref(localStorage.getItem('s5m_next_token') || '');
      const loginUser = ref('admin');
      const loginPass = ref('');
      const loggingIn = ref(false);
      const subUrl = ref('http://foodflow.v2net.cc/api/sub');
      const configYaml = ref('');

      const switchPage = (v) => {
        page.value = v;
        if (v === 'instances') loadAgentsData();
      };

      const doLogin = async () => {
        if(!loginUser.value || !loginPass.value) return alert('请输入账号密码');
        loggingIn.value = true;
        try {
          const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: loginUser.value, password: loginPass.value })
          });
          const data = await res.json();
          if (res.ok && data.token) {
            localStorage.setItem('s5m_next_token', data.token);
            token.value = data.token;
            loginPass.value = '';
            switchPage('dashboard');
          } else {
            alert(data.error || '登录失败');
          }
        } catch(e) { alert('网络错误'); }
        loggingIn.value = false;
      };

      const logout = () => {
        localStorage.removeItem('s5m_next_token');
        token.value = '';
      };

      window.loadAgentsData = async () => {
        var tb = document.getElementById('agent-list-body');
        if (!tb) return;
        tb.innerHTML = '<tr><td colspan="3" style="padding: 20px; text-align: center; color: #999;">正在加载...</td></tr>';
        try {
          
const res = await fetch('/api/v1/agents?t=" + Date.now(), { headers: { 'Authorization': 'Bearer ' + token.value } });
          if (!res.ok) {
              if (res.status === 401) throw new Error('登录已过期，请重新登录');
              throw new Error('服务器返回错误: ' + res.status);
          }

          if (res.status === 401) { logout(); throw new Error('登录已过期'); }
          const data = await res.json();
          const keys = Object.keys(data);
          if (!keys.length) {
            tb.innerHTML = '<tr><td colspan="3" style="padding: 20px; text-align: center; color: #999;">暂无数据</td></tr>';
            return;
          }
          var h = '';
          keys.forEach(k => {
            var v = data[k];
            h += '<tr>';
            h += '<td style="padding: 12px; border-bottom: 1px solid #ebeef5; font-family: monospace;">' + k + '</td>';
            h += '<td style="padding: 12px; border-bottom: 1px solid #ebeef5; color: #909399; font-family: monospace; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + v + '</td>';
            h += '<td style="padding: 12px; border-bottom: 1px solid #ebeef5;">';
            h += '<el-button size="small" type="success" onclick="safeCopy(\'' + v + '\')">复制机器码</el-button>';
            h += '</td></tr>';
          });
          tb.innerHTML = h;
        } catch(e) {
          tb.innerHTML = '<tr><td colspan="3" style="padding: 20px; text-align: center; color: red;">' + e.message + '</td></tr>';
        }
      };

      window.safeCopy = (text) => {
        if(!text) return;
        var t = document.createElement("textarea"); t.value = text; t.style.position = 'fixed'; t.style.left = '-9999px';
        document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); alert('复制成功'); } catch (e) { alert('复制失败'); }
        document.body.removeChild(t);
      };

      const publishConfig = async () => {
        if (!configYaml.value) return alert('配置不能为空');
        try {
          const res = await fetch('/api/v1/config/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token.value },
            body: JSON.stringify({ config_yaml: configYaml.value })
          });
          const data = await res.json();
          if (res.ok) alert('发布成功，Agent 将在 30 秒内更新');
          else alert(data.error || '发布失败');
        } catch(e) { alert('网络错误'); }
      };

      onMounted(() => {
        if(token.value) switchPage('dashboard');
      });

      return { page, token, loginUser, loginPass, loggingIn, subUrl, configYaml, switchPage, doLogin, logout, publishConfig };
    }
  }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
