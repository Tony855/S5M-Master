name: S5M CI

on:
  push:
    branches: [dev, main, "fix/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: source/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build server
        run: go build -trimpath -o /tmp/s5m-server .

  agent:
    name: Agent tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s5m-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Agent entrypoint shell syntax
        run: sh -n entrypoint.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: s5m-agent/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build agent
        run: go build -trimpath -o /tmp/s5m-agent .

  web-assets:
    name: Embedded web asset checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate installer shell syntax and password generator
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          password="$(openssl rand -hex 24)"
          [[ "$password" =~ ^[a-f0-9]{48}$ ]]
      - name: Verify required web files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            source/web/index.html
            source/web/app.js
            source/web/agents.html
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required web asset"
              missing=1
            else
              echo "OK: $file ($(wc -c < "$file") bytes)"
            fi
          done
          exit "$missing"
