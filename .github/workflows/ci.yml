name: S5M CI

on:
  push:
    branches: [dev, main, s5m-agent-smartdns, "fix/**"]
  pull_request:
    branches: [dev, main, s5m-agent-smartdns]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate native installer shell syntax
        run: bash -n ../scripts/install.sh
      - name: Guard installer against duplicate domain and certificate prompts
        shell: bash
        run: |
          set -euo pipefail
          installer=../scripts/install.sh
          python3 - "$installer" <<'PY'
          from pathlib import Path
          import sys

          script = Path(sys.argv[1]).read_text(encoding="utf-8")
          detection = script.index("# 解析 nginx -T 输出，查找已存在的 S5M HTTPS 虚拟主机")
          prompt = script.index('read -r -p "请输入面板域名（留空则暂不配置 HTTPS）: "')
          cert_issue = script.index('certbot --nginx --non-interactive')
          assert detection < prompt < cert_issue, "TLS detection must happen before prompting and certificate issuance"
          for marker in (
              "nginx -T 2>/dev/null | python3 -c",
              "只复用 443+ssl+proxy_pass 127.0.0.1:8080 且证书有效的 server 块",
              "proxy_pass",
              "ssl_certificate_key",
              "openssl x509 -in \"$cert_path\" -noout -checkhost",
              "openssl x509 -in \"$cert_path\" -noout -checkend 0",
              "HTTPS_ALREADY_CONFIGURED=1",
              "不重新询问域名或签发证书",
          ):
              assert marker in script, f"missing existing TLS reuse guard: {marker}"
          print("PASS: installer parses expanded Nginx server blocks and validates S5M TLS certificate/domain before prompting")
          PY
      - name: Test IPv4 and IPv6 HTTPS listener detection patterns
        shell: bash
        run: |
          set -euo pipefail
          listener_re='^[[:space:]]*listen[[:space:]]+(\[::\]:)?443[[:space:]]+ssl([[:space:]]|;|$)'
          for line in 'listen 443 ssl;' '    listen [::]:443 ssl;' 'listen 443 ssl http2;'; do
            printf '%s\n' "$line" | grep -Eq "$listener_re" || {
              echo "FAIL: expected HTTPS listener to match: $line"
              exit 1
            }
          done
          for line in 'listen 80;' 'listen [::]:80;' 'listen 8443 ssl;'; do
            if printf '%s\n' "$line" | grep -Eq "$listener_re"; then
              echo "FAIL: non-443 listener matched: $line"
              exit 1
            fi
          done
          echo "PASS: IPv4/IPv6 port-443 SSL listeners detected; non-TLS listeners ignored"

      - name: Guard installer against false Nginx port-80 conflicts
        shell: bash
        run: |
          set -euo pipefail
          python3 - ../scripts/install.sh <<'PY'
          from pathlib import Path
          import sys
          script = Path(sys.argv[1]).read_text(encoding="utf-8")
          assert 'EXISTING_ADDR="$(sed -n \'s/^S5M_ADDR=//p\' "$ENV_FILE" | tail -n1)"' in script
          assert 'PORT_TO_USE=8080' in script
          assert '不将其误判为 S5M 后端冲突' in script
          assert '不将其误判为 S5M 后端冲突' in script
          assert 'grep -oP \'pid=\\K[0-9]+\'' in script
          print("PASS: installer derives backend port from S5M_ADDR and does not mistake public Nginx :80 for S5M backend")
          PY
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: source/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build server
        run: go build -trimpath -o /tmp/s5m-server .
      - name: Validate shared proxy YAML anchors with Mihomo
        shell: bash
        run: |
          set -euo pipefail
          version="v1.19.33"
          archive="/tmp/mihomo-${version}.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${version}/mihomo-linux-amd64-${version}.gz"
          gzip -dc "$archive" > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -t -f internal/app/testdata/mihomo-anchors.yaml
          /tmp/mihomo -t -f ../s5m-agent/default-config.yaml

  agent:
    name: Agent tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s5m-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate S6 service and initialization shell syntax
        run: |
          sh -n cont-init.d/10-mihomo-config
          sh -n services/mihomo/run
          sh -n services/agent/run
          sh -n smartdns/cont-init.d/20-smartdns-config
          sh -n smartdns/services/smartdns/run
          sh -n smartdns/healthcheck.sh
          sh -n routeros/cont-init.d/10-mihomo-config
          sh -n routeros/services/mihomo/run
          sh -n routeros/services/agent/run
      - name: Verify Agent Compose TUN capabilities match the default config
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          import json, subprocess
          rendered = subprocess.run(
              ["docker", "compose", "-f", "s5m-agent/docker-compose.yml", "config", "--format", "json"],
              check=True, capture_output=True, text=True,
          )
          model = json.loads(rendered.stdout)
          service = model["services"]["s5m-agent"]
          config = Path("s5m-agent/default-config.yaml").read_text(encoding="utf-8")
          tun = config.split("tun:", 1)[1].split("proxies:", 1)[0]
          assert "NET_ADMIN" in service.get("cap_add", []), "Compose must grant NET_ADMIN for opt-in TUN"
          assert any(item.startswith("/dev/net/tun:/dev/net/tun") for item in service.get("devices", [])), "Compose must map /dev/net/tun for opt-in TUN"
          assert re.search(r"(?m)^  enable: false$", tun), "first-boot Agent config must keep TUN disabled"
          assert service.get("network_mode") != "host", "Agent must not use host networking"
          assert "Existing /data/config.yaml is intentionally preserved" in config, "existing runtime config must not be overwritten"
          print("PASS: parsed Compose model confirms TUN permissions, bridge networking and disabled first-boot TUN")
          PY
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: s5m-agent/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build agent
        run: go build -trimpath -o /tmp/s5m-agent .
      - name: Verify RouterOS profile remains separate from remote container management
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("s5m-agent/main.go").read_text(encoding="utf-8")
          init = Path("s5m-agent/routeros/cont-init.d/10-mihomo-config").read_text(encoding="utf-8")
          dockerfile = Path("s5m-agent/Dockerfile.routeros").read_text(encoding="utf-8")
          assert 'filepath.Join(mihomoHome(), "bin", "mihomo")' in main
          assert 'S5M_ROUTEROS=1' in dockerfile
          assert 'MIHOMO_HOME}/bin/mihomo' in init
          assert 'ENTRYPOINT ["/init"]' in dockerfile
          assert 's6-overlay' in dockerfile
          assert 'processContainerTask' not in main
          assert 'reportContainerStatus' not in main
          print("RouterOS persistent kernel profile verified; remote container task handlers remain absent")
          PY
      - name: Cross-compile Agent for supported Linux architectures
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "Building s5m-agent for linux/${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags='-s -w' -o "/tmp/s5m-agent-linux-${arch}" .
            file "/tmp/s5m-agent-linux-${arch}"
          done

  web-assets:
    name: Embedded web asset checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate installer shell syntax and password generator
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          password="$(openssl rand -hex 24)"
          [[ "$password" =~ ^[a-f0-9]{48}$ ]]
      - name: Validate Agent TUN isolation and host SSH safety
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/s5m-deploy.sh
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/s5m-deploy.sh").read_text(encoding="utf-8")
          run_start = script.index("docker run -d")
          run_end = script.index('|| die "容器启动失败"', run_start)
          run_block = script[run_start:run_end]
          checks = {
              "Agent container explicitly uses Docker bridge networking": "--network bridge" in run_block,
              "Agent docker run command never selects host networking": "--network host" not in run_block,
              "Agent TUN route changes are documented as container namespace scoped": "Keep Mihomo TUN routes inside the Agent container's network namespace" in script,
              "Runtime guard verifies the actual container network mode": "docker inspect -f '{{.HostConfig.NetworkMode}}' \"$CONTAINER\"" in script and 'if [ "$network_mode" != "bridge" ]; then' in script,
              "Deployment does not publish host SSH port 22": '-p "22:' not in script and "-p 22:" not in script,
              "Deployment does not perform global Docker cleanup": "docker system prune" not in script and "docker rm -f $(docker ps -aq)" not in script and "docker rmi -f $(docker images -aq)" not in script,
              "Deployment does not delete persistent Agent data": 'rm -rf "/opt/s5m-agent"' not in script and "rm -rf /opt/s5m-agent" not in script,
              "Health checks support curl, wget and Python fallbacks": "http_get()" in script and "http_head()" in script and "urllib.request" in script and "wget -qO-" in script,
              "Health checks use fallback helpers instead of requiring curl": 'http_get "http://127.0.0.1:${PORT_WEB}/api/machine-id"' in script and 'http_head "http://127.0.0.1:${PORT_WEB}"' in script,
          }
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if not all(checks.values()):
              raise SystemExit(1)
          PY
      - name: Integration test Docker route isolation from host network
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info >/dev/null
          test_cidr="198.51.100.0/24"
          if ip route show table all | grep -Fq "$test_cidr"; then
            echo "Refusing test: reserved test CIDR already exists on runner host"
            exit 1
          fi
          # Change only a temporary bridge container's route table. If TUN-like
          # route changes leak into the host namespace, the host assertion fails.
          docker run --rm --network bridge --cap-add NET_ADMIN alpine:3.21 sh -ec '
            apk add --no-cache iproute2 >/dev/null
            ip route add blackhole 198.51.100.0/24
            ip route show 198.51.100.0/24 | grep -F "blackhole 198.51.100.0/24"
          '
          if ip route show table all | grep -Fq "$test_cidr"; then
            echo "FAIL: container route change leaked into host route table"
            exit 1
          fi
          echo "PASS: container route change stayed in its bridge network namespace; host route table unchanged"
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.inline = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.inline = not any(key.lower() == "src" for key, _ in attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.inline:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.inline:
                          self.scripts.append("".join(self.parts))
                      self.inline = False
                      self.parts = []

          html = Path("source/web/index.html").read_text(encoding="utf-8")
          parser = InlineScriptExtractor()
          parser.feed(html)
          for index, script in enumerate(parser.scripts):
              target = Path(f"/tmp/s5m-inline-{index}.js")
              target.write_text(script, encoding="utf-8")
              print(f"Extracted {target} ({len(script)} characters)")
          PY
          node --check source/web/app.js
          for file in /tmp/s5m-inline-*.js; do
            [[ -f "$file" ]] || continue
            node --check "$file"
          done
      - name: Verify Agent first-boot DNS/TUN defaults match controller normalization
        shell: bash
        run: |
          set -euo pipefail
          config=s5m-agent/default-config.yaml
          generator=source/internal/app/configgen.go
          grep -Fq 'mixed-port: 7890' "$config"
          grep -Fq 'external-controller: 127.0.0.1:8088' "$config"
          grep -Fq '  ipv6: false' "$config"
          grep -Fq '    - "*.local"' "$config"
          grep -Fq '    - "geosite:private"' "$config"
          grep -Fq '  default-nameserver:' "$config"
          grep -Fq '    - "any:53"' "$config"
          grep -A2 '^tun:' "$config" | grep -Fq '  enable: false'
          grep -Fq "default-nameserver:" "$generator"
          grep -Fq "'*.local'" "$generator"
          grep -Fq "'geosite:private'" "$generator"
          grep -Fq "dns-hijack:" "$generator"
          grep -Fq "'any:53'" "$generator"
          grep -Fq 'Existing /data/config.yaml is intentionally preserved' "$config"
          grep -Fq "sendBrowserWSControl({ type: 'node.config.get', machine_code: code })" source/web/app.js
          ! grep -Fq "api('/api/v1/nodes/' + encodeURIComponent(code) + '/config" source/web/app.js
          echo "PASS: Agent DNS/TUN defaults match controller normalization; TUN stays disabled; node config reads use WebSocket."
      - name: Check UI data-integrity regressions
        run: python3 scripts/check-web-regressions.py
      - name: Test YAML quick-settings behavior
        run: node scripts/test-yaml-quick-settings.js
      - name: Verify required web files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            source/web/index.html
            source/web/app.css
            source/web/app.js
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required web asset"
              missing=1
            else
              echo "OK: $file ($(wc -c < "$file") bytes)"
            fi
          done
          exit "$missing"
