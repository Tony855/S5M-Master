name: S5M CI

on:
  push:
    branches: [dev, main, "fix/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate native installer shell syntax
        run: bash -n ../scripts/install.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: source/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build server
        run: go build -trimpath -o /tmp/s5m-server .

  agent:
    name: Agent tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s5m-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Agent entrypoint shell syntax
        run: sh -n entrypoint.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: s5m-agent/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build agent
        run: go build -trimpath -o /tmp/s5m-agent .

  routeros-agent:
    name: RouterOS Agent tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routeros-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: routeros-agent/go.mod
      - name: Format Go source
        run: gofmt -w .
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            gofmt -d $files
            exit 1
          fi
      - name: Run tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build RouterOS Agent
        run: go build -trimpath -o /tmp/s5m-routeros-agent .

  web-assets:
    name: Embedded web asset checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate installer shell syntax and password generator
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          password="$(openssl rand -hex 24)"
          [[ "$password" =~ ^[a-f0-9]{48}$ ]]
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.inline = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.inline = not any(key.lower() == "src" for key, _ in attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.inline:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.inline:
                          self.scripts.append("".join(self.parts))
                      self.inline = False
                      self.parts = []

          html = Path("source/web/index.html").read_text(encoding="utf-8")
          parser = InlineScriptExtractor()
          parser.feed(html)
          for index, script in enumerate(parser.scripts):
              target = Path(f"/tmp/s5m-inline-{index}.js")
              target.write_text(script, encoding="utf-8")
              print(f"Extracted {target} ({len(script)} characters)")
          PY
          node --check source/web/app.js
          for file in /tmp/s5m-inline-*.js; do
            [[ -f "$file" ]] || continue
            node --check "$file"
          done
      - name: Check UI data-integrity regressions
        run: python3 scripts/check-web-regressions.py
      - name: Verify required web files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            source/web/index.html
            source/web/app.css
            source/web/app.js
            source/web/agents.html
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required web asset"
              missing=1
            else
              echo "OK: $file ($(wc -c < "$file") bytes)"
            fi
          done
          exit "$missing"
