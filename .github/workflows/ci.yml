name: S5M CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Go test, vet and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Agent entrypoint shell syntax
        run: sh -n s5m-agent/entrypoint.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build server
        run: go build -trimpath -o /tmp/s5m-server .
      - name: Build agent
        working-directory: s5m-agent
        run: go build -trimpath -o /tmp/s5m-agent .
  web-assets:
    name: Embedded web asset checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify required web files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            web/index.html
            web/vendor/vue.global.prod.js
            web/vendor/element-plus.full.js
            web/vendor/element-plus.css
            web/vendor/icons.js
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required web asset"
              missing=1
            else
              echo "OK: $file ($(wc -c < "$file") bytes)"
            fi
          done
          exit "$missing"
