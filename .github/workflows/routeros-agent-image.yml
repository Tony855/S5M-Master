name: S5M RouterOS Agent image

on:
  push:
    branches: [main, dev]
    paths:
      - "routeros-agent/**"
      - ".github/workflows/routeros-agent-image.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "routeros-agent/**"
      - ".github/workflows/routeros-agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tony855/s5m-routeros-agent

jobs:
  build:
    name: Build RouterOS Agent image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: routeros-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build AMD64 smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: routeros-agent/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: s5m-routeros-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test AMD64 image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh s5m-routeros-agent:smoke -c 'test -x /usr/local/bin/s5m-routeros-agent'
