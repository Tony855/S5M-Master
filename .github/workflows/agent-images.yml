name: S5M Agent multi-arch images

on:
  push:
    branches: [main, dev]
    tags: ["s5m-agent-v*"]
  pull_request:
    branches: [main, dev]
    paths:
      - "s5m-agent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agent-images.yml"
      - "docs/ROUTEROS_NATIVE_AGENT_CN.md"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Stable release version (for example 1.0.0). Leave empty for a dev build only."
        required: false
        type: string
        default: ""

# Serialize a manual release and its matching tag-push workflow as one run.
# Both resolve to refs/tags/s5m-agent-vX.Y.Z; ordinary branch builds remain
# isolated by their own ref. Never cancel a run that may be publishing.
concurrency:
  # Serialize all stable releases together so an older version cannot race a newer one
  # while deciding whether it is allowed to update the mutable GHCR latest tag.
  group: s5m-agent-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '') && 'stable-release' || (startsWith(github.ref, 'refs/tags/s5m-agent-v') && 'stable-release') || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tony855/s5m-agent

jobs:
  build-and-publish:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.tags.outputs.release_version }}
      image_tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          # Read the workflow_dispatch payload directly, with the inputs context as fallback.
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.release_version || inputs.release_version || '' }}
        run: |
          set -euo pipefail
          release_version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == s5m-agent-v* ]]; then
            release_version="${GITHUB_REF_NAME#s5m-agent-v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Preserve the raw UI input so validation and the workflow concurrency key use the same version.
            release_version="${RELEASE_VERSION_INPUT}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -n "${release_version}" ]]; then
              echo "Workflow dispatch release input received: ${release_version}"
            else
              echo "Workflow dispatch release input received: <empty> (dev build only)"
            fi
          fi

          if [[ -n "${release_version}" && ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release version::Use semantic version X.Y.Z, for example 1.0.0."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${release_version}" ]]; then
            release_tag="s5m-agent-v${release_version}"
            if ! existing_tag_refs="$(git ls-remote --tags origin "refs/tags/${release_tag}")"; then
              echo "::error title=Tag lookup failed::Could not verify whether ${release_tag} exists; refusing to continue."
              exit 1
            fi
            if [[ -n "${existing_tag_refs}" ]]; then
              echo "::error title=Release tag already exists::${release_tag} already exists. Choose a new version."
              exit 1
            fi
          fi

          publish_latest="false"
          if [[ -n "${release_version}" ]]; then
            # Only the numerically highest stable version may move the mutable latest tag.
            if ! remote_release_tags="$(git ls-remote --tags --refs origin 'refs/tags/s5m-agent-v*')"; then
              echo "::error title=Release tag listing failed::Could not determine the highest published S5M Agent version."
              exit 1
            fi
            highest_version="$(
              printf '%s\n' "${remote_release_tags}" |
                awk '{sub(/^refs\/tags\/s5m-agent-v/, "", $2); if ($2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) print $2}' |
                sort -V | tail -n 1
            )"
            if [[ -z "${highest_version}" || "$(printf '%s\n' "${release_version}" "${highest_version}" | sort -V | tail -n 1)" == "${release_version}" ]]; then
              publish_latest="true"
            fi
            echo "latest_tag_candidate=${publish_latest}" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "tags<<EOF"
            if [[ -n "${release_version}" ]]; then
              echo "${IMAGE_NAME}:v${release_version}"
              if [[ "${publish_latest}" == "true" ]]; then
                echo "${IMAGE_NAME}:latest"
              else
                echo "Not moving latest: published stable version ${highest_version} is newer than ${release_version}."
              fi
            elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
              # Keep ordinary main builds separate from development builds.
              echo "${IMAGE_NAME}:main"
            else
              echo "${IMAGE_NAME}:dev"
            fi
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "EOF"
            echo "release_version=${release_version}" 
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image for archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: s5m-agent:amd64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64 image contents
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          timeout 30s docker run --rm --entrypoint /bin/sh s5m-agent:amd64-test -c 'test -x /app/s5m-agent && test -x /usr/local/bin/mihomo && test -x /healthcheck.sh && test -x /init && test -x /etc/cont-init.d/10-mihomo-config && test -x /etc/s6-overlay/s6-rc.d/mihomo/run && test -x /etc/s6-overlay/s6-rc.d/agent/run && /usr/local/bin/mihomo -v'

      - name: Test real container startup, health and published ports
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          fake_id_file="$(mktemp)"
          container="s5m-agent-runtime-test"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            sudo rm -rf "$data_dir"
            rm -f "$fake_id_file"
          }
          trap cleanup EXIT

          # Use a deterministic test-only system machine-id; never print it.
          printf '%s\n' '0123456789abcdef0123456789abcdef' > "$fake_id_file"
          chmod 0444 "$fake_id_file"

          docker run -d --name "$container" --restart no \
            -p 127.0.0.1::80/tcp \
            -p 127.0.0.1::7890/tcp \
            -v "$data_dir:/data" \
            -v "$fake_id_file:/etc/machine-id:ro" \
            s5m-agent:amd64-test >/dev/null

          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
            if [[ "$state" == "running" && "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$state" != "running" ]]; then
              echo "Agent 容器未能保持 running 状态" >&2
              docker logs "$container" >&2
              exit 1
            fi
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]] || {
            echo "Agent Docker healthcheck 未通过" >&2
            docker logs "$container" >&2
            docker inspect --format '{{json .State.Health}}' "$container" >&2
            exit 1
          }

          agent_port="$(docker port "$container" 80/tcp | awk -F: 'NR==1 {print $NF}')"
          proxy_port="$(docker port "$container" 7890/tcp | awk -F: 'NR==1 {print $NF}')"
          [[ -n "$agent_port" && -n "$proxy_port" ]]
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${agent_port}/api/config" >/dev/null

          machine_id="$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${agent_port}/api/machine-id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["machine_id"])')"
          [[ "$machine_id" == "0123456789a" ]] || {
            echo "Agent API machine-id 与挂载的系统 machine-id 前 11 位不匹配" >&2
            exit 1
          }

          # Check actual reachability through the mapped mixed port, not only EXPOSE.
          for attempt in $(seq 1 15); do
            if nc -z -w 2 127.0.0.1 "$proxy_port"; then break; fi
            sleep 1
          done
          nc -z -w 2 127.0.0.1 "$proxy_port" || {
            echo "容器已健康但 mixed-port 7890 未通过宿主机映射访问" >&2
            docker logs "$container" >&2
            exit 1
          }

          # Do not publish the private controller API.
          if docker port "$container" 8088/tcp 2>/dev/null | grep -q .; then
            echo "Mihomo control API 8088 意外映射到宿主机" >&2
            exit 1
          fi

          # Recreate with the same /data and machine-id bind mount.
          docker rm -f "$container" >/dev/null
          docker run -d --name "$container" --restart no \
            -p 127.0.0.1::80/tcp \
            -p 127.0.0.1::7890/tcp \
            -v "$data_dir:/data" \
            -v "$fake_id_file:/etc/machine-id:ro" \
            s5m-agent:amd64-test >/dev/null
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
            [[ "$health" == "healthy" ]] && break
            [[ "$(docker inspect --format '{{.State.Status}}' "$container")" == "running" ]] || {
              docker logs "$container" >&2
              exit 1
            }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]]
          agent_port="$(docker port "$container" 80/tcp | awk -F: 'NR==1 {print $NF}')"
          second_machine_id="$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${agent_port}/api/machine-id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["machine_id"])')"
          [[ "$second_machine_id" == "$machine_id" ]] || {
            echo "容器重建后机器标识发生变化" >&2
            exit 1
          }
      - name: Test persistent machine ID fallback without system ID
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          empty_id_file="$(mktemp)"
          container="s5m-agent-fallback-test"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            sudo rm -rf "$data_dir"
            rm -f "$empty_id_file"
          }
          trap cleanup EXIT

          # Simulate a host/container environment with no usable system machine-id.
          : > "$empty_id_file"
          chmod 0444 "$empty_id_file"
          docker run -d --name "$container" --restart no \
            -p 127.0.0.1::80/tcp \
            -v "$data_dir:/data" \
            -v "$empty_id_file:/etc/machine-id:ro" \
            s5m-agent:amd64-test >/dev/null

          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
            if [[ "$state" == "running" && "$health" == "healthy" ]]; then break; fi
            [[ "$state" == "running" ]] || { docker logs "$container" >&2; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]]
          agent_port="$(docker port "$container" 80/tcp | awk -F: 'NR==1 {print $NF}')"
          first_id="$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${agent_port}/api/machine-id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["machine_id"])')"
          [[ "${#first_id}" -eq 11 ]]
          [[ -s "$data_dir/machine-id" ]] || { echo "Fallback machine ID was not persisted in /data" >&2; exit 1; }
          sudo chmod 0644 "$data_dir/machine-id"
          python3 - "$data_dir/machine-id" "$first_id" <<'PY'
          import pathlib, re, sys
          data = pathlib.Path(sys.argv[1]).read_text().strip()
          api_id = sys.argv[2]
          if not re.fullmatch(r"[0-9a-f]{32}", data) or data == "0" * 32:
              raise SystemExit("Persisted fallback machine-id is not a valid 32-character hex ID")
          if data[:11] != api_id:
              raise SystemExit("API machine-id does not match persisted fallback ID")
          PY

          # Recreate without changing either /data or the empty system-id mount.
          docker rm -f "$container" >/dev/null
          docker run -d --name "$container" --restart no \
            -p 127.0.0.1::80/tcp \
            -v "$data_dir:/data" \
            -v "$empty_id_file:/etc/machine-id:ro" \
            s5m-agent:amd64-test >/dev/null
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
            [[ "$health" == "healthy" ]] && break
            [[ "$(docker inspect --format '{{.State.Status}}' "$container")" == "running" ]] || { docker logs "$container" >&2; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]]
          agent_port="$(docker port "$container" 80/tcp | awk -F: 'NR==1 {print $NF}')"
          second_id="$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${agent_port}/api/machine-id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["machine_id"])')"
          [[ "$second_id" == "$first_id" ]] || {
            echo "Fallback machine ID changed after container recreation with /data preserved" >&2
            exit 1
          }

      - name: Export amd64 archive
        run: |
          mkdir -p dist
          docker save s5m-agent:amd64-test -o dist/s5m-agent-linux-amd64.tar
          (cd dist && sha256sum s5m-agent-linux-amd64.tar > s5m-agent-linux-amd64.tar.sha256)

      - name: Upload amd64 archive
        uses: actions/upload-artifact@v4
        with:
          name: s5m-agent-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  build-arm64-archive:
    name: Build ARM64 Linux archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: linux/arm64
          load: true
          tags: s5m-agent:arm64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate ARM64 image contents and architecture
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect s5m-agent:arm64-test --format '{{.Os}}/{{.Architecture}}' | grep -Fx 'linux/arm64'
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh s5m-agent:arm64-test -c 'test -x /app/s5m-agent && test -x /usr/local/bin/mihomo && test -x /healthcheck.sh && test -x /init && test -x /etc/cont-init.d/10-mihomo-config && test -x /etc/s6-overlay/s6-rc.d/mihomo/run && test -x /etc/s6-overlay/s6-rc.d/agent/run && /usr/local/bin/mihomo -v'

      - name: Export ARM64 archive
        run: |
          mkdir -p dist
          docker save s5m-agent:arm64-test -o dist/s5m-agent-linux-arm64.tar
          (cd dist && sha256sum s5m-agent-linux-arm64.tar > s5m-agent-linux-arm64.tar.sha256)

      - name: Upload ARM64 archive
        uses: actions/upload-artifact@v4
        with:
          name: s5m-agent-linux-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  build-routeros-archives:
    name: Build RouterOS native container archive (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build RouterOS-specific image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: s5m-agent/Dockerfile.routeros
          platforms: ${{ matrix.platform }}
          load: true
          tags: s5m-agent:routeros-${{ matrix.arch }}-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test RouterOS profile image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} --entrypoint /bin/sh s5m-agent:routeros-${{ matrix.arch }}-test -ec '
            test -x /init
            test -x /app/s5m-agent
            test -x /healthcheck.sh
            test -x /usr/local/bin/mihomo.initial
            test -x /etc/cont-init.d/10-mihomo-config
            test -x /etc/s6-overlay/s6-rc.d/mihomo/run
            test -x /etc/s6-overlay/s6-rc.d/agent/run
            test -f /etc/s6-overlay/s6-rc.d/user/contents.d/mihomo
            test -f /etc/s6-overlay/s6-rc.d/user/contents.d/agent
            test -s /app/default-config.yaml
            /usr/local/bin/mihomo.initial -v
          '
          docker image inspect s5m-agent:routeros-${{ matrix.arch }}-test --format '{{.Os}}/{{.Architecture}}' | grep -Fx '${{ matrix.platform }}'
      - name: Test RouterOS image service supervision
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          container="s5m-routeros-runtime-${{ matrix.arch }}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            sudo rm -rf "$data_dir"
          }
          trap cleanup EXIT
          start_and_check() {
            docker run -d --name "$container" --platform ${{ matrix.platform }} \
              -p 127.0.0.1::80/tcp -v "$data_dir:/data" \
              s5m-agent:routeros-${{ matrix.arch }}-test >/dev/null
            for attempt in $(seq 1 60); do
              state="$(docker inspect --format '{{.State.Status}}' "$container")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
              if [[ "$state" != "running" ]]; then docker logs "$container" >&2; exit 1; fi
              if [[ "$health" == "healthy" ]]; then break; fi
              sleep 2
            done
            [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]] || {
              docker logs "$container" >&2
              docker inspect --format '{{json .State.Health}}' "$container" >&2
              exit 1
            }
            port="$(docker port "$container" 80/tcp | awk -F: 'NR==1 {print $NF}')"
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${port}/api/config" >/dev/null
          }
          start_and_check
          test -x "$data_dir/bin/mihomo"
          test -s "$data_dir/config.yaml"
          # Files are created by the root user inside the container; read hashes with sudo.
          kernel_hash="$(sudo sha256sum "$data_dir/bin/mihomo" | awk '{print $1}')"
          config_hash="$(sudo sha256sum "$data_dir/config.yaml" | awk '{print $1}')"
          # Recreate the container while keeping RouterOS's persistent /data mount.
          docker rm -f "$container" >/dev/null
          start_and_check
          [[ "$(sudo sha256sum "$data_dir/bin/mihomo" | awk '{print $1}')" == "$kernel_hash" ]] || {
            echo "Persistent Mihomo kernel changed after container recreation" >&2
            exit 1
          }
          [[ "$(sudo sha256sum "$data_dir/config.yaml" | awk '{print $1}')" == "$config_hash" ]] || {
            echo "Persistent Mihomo configuration changed after container recreation" >&2
            exit 1
          }

      - name: Export RouterOS image archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save s5m-agent:routeros-${{ matrix.arch }}-test -o dist/s5m-agent-routeros-${{ matrix.arch }}.tar
          (cd dist && sha256sum s5m-agent-routeros-${{ matrix.arch }}.tar > s5m-agent-routeros-${{ matrix.arch }}.tar.sha256)
      - name: Upload RouterOS archive
        uses: actions/upload-artifact@v4
        with:
          name: s5m-agent-routeros-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish-container-image:
    name: Publish multi-arch Agent image to GHCR
    if: github.event_name != 'pull_request' && needs.build-and-publish.result == 'success' && needs.build-arm64-archive.result == 'success' && needs.build-routeros-archives.result == 'success'
    needs: [build-and-publish, build-arm64-archive, build-routeros-archives]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify stable release tag before GHCR push
        if: needs.build-and-publish.outputs.release_version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build-and-publish.outputs.release_version }}
        run: |
          set -euo pipefail
          release_tag="s5m-agent-v${RELEASE_VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # A tag-triggered release must use the commit that the pushed tag resolves to.
            if ! tag_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"; then
              echo "::error title=Tag verification failed::Could not resolve ${GITHUB_REF} to a commit."
              exit 1
            fi
            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error title=Tag commit mismatch::${release_tag} resolves to ${tag_commit}, but this workflow checked out ${GITHUB_SHA}."
              exit 1
            fi
            echo "Verified tag ${release_tag} points to workflow commit ${GITHUB_SHA}."
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # A manually requested version must be unused before its image is published.
            if ! existing_tag_refs="$(git ls-remote --tags origin "refs/tags/${release_tag}")"; then
              echo "::error title=Tag lookup failed::Could not verify whether ${release_tag} exists; refusing to push release image."
              exit 1
            fi
            if [[ -n "${existing_tag_refs}" ]]; then
              echo "::error title=Release tag already exists::${release_tag} already exists; refusing to push or overwrite its image."
              exit 1
            fi
            echo "Verified ${release_tag} is unused for this manual release."
          else
            echo "::error title=Unexpected release trigger::Stable release version was set for unsupported event ${GITHUB_EVENT_NAME}."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push tested multi-architecture Agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build-and-publish.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify GHCR manifest architectures and tag consistency
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAGS: ${{ needs.build-and-publish.outputs.image_tags }}
        run: |
          set -euo pipefail
          sha_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${sha_tag}" --raw > /tmp/s5m-agent-manifest.json

          python3 - /tmp/s5m-agent-manifest.json <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          media_type = manifest.get("mediaType", "")
          if media_type not in {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }:
              raise SystemExit(f"Expected a multi-platform image index, got mediaType={media_type!r}")
          platforms = {
              (item.get("platform") or {}).get("os", "") + "/" +
              (item.get("platform") or {}).get("architecture", "")
              for item in manifest.get("manifests", [])
          }
          required = {"linux/amd64", "linux/arm64"}
          missing = required - platforms
          if missing:
              raise SystemExit(f"GHCR manifest is missing required platforms: {sorted(missing)}; found {sorted(platforms)}")
          print("Verified GHCR platforms: " + ", ".join(sorted(required)))
          PY

          expected_digest="$(docker buildx imagetools inspect "${sha_tag}" | awk '/^Digest:/ {print $2; exit}')"
          [[ -n "${expected_digest}" ]] || {
            echo "::error title=Image digest unavailable::Could not read digest for ${sha_tag}."
            exit 1
          }
          while IFS= read -r image_tag; do
            [[ -n "${image_tag}" ]] || continue
            actual_digest="$(docker buildx imagetools inspect "${image_tag}" | awk '/^Digest:/ {print $2; exit}')"
            [[ -n "${actual_digest}" && "${actual_digest}" == "${expected_digest}" ]] || {
              echo "::error title=Image tag digest mismatch::${image_tag} does not resolve to the commit image digest."
              exit 1
            }
          done <<< "${IMAGE_TAGS}"
          echo "Verified every published tag resolves to ${expected_digest}."
  publish-github-release:
    name: Publish stable GitHub Release
    # Run the decision step after successful builds even for PR/dev runs, so
    # GitHub reports why a release was not created instead of silently skipping the job.
    if: always() && needs.build-and-publish.result == 'success' && needs.build-arm64-archive.result == 'success' && needs.build-routeros-archives.result == 'success' && (needs.publish-container-image.result == 'success' || (github.event_name == 'pull_request' && needs.publish-container-image.result == 'skipped'))
    needs: [build-and-publish, build-arm64-archive, build-routeros-archives, publish-container-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for release tag checks
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject an existing release tag on manual dispatch
        if: github.event_name == 'workflow_dispatch' && needs.build-and-publish.outputs.release_version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build-and-publish.outputs.release_version }}
        run: |
          set -euo pipefail
          release_tag="s5m-agent-v${RELEASE_VERSION}"
          if ! existing_tag_refs="$(git ls-remote --tags origin "refs/tags/${release_tag}")"; then
            echo "::error title=Tag lookup failed::Could not verify whether ${release_tag} exists; refusing to publish."
            exit 1
          fi
          if [[ -n "${existing_tag_refs}" ]]; then
            echo "::error title=Release tag already exists::${release_tag} already exists; refusing to overwrite an existing release."
            exit 1
          fi

      - name: Decide whether this run requested a stable release
        id: release_gate
        shell: bash
        env:
          # Fallback to the original dispatch payload if a job output is unexpectedly empty.
          RELEASE_VERSION: ${{ needs.build-and-publish.outputs.release_version || github.event.inputs.release_version || inputs.release_version || '' }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION}"
          if [[ -n "${release_version}" ]]; then
            if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Invalid release version::Received '${release_version}', expected X.Y.Z (for example 1.0.0)."
              exit 1
            fi
            echo "Release gate received version: ${release_version}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "tag=s5m-agent-v${release_version}" >> "$GITHUB_OUTPUT"
            echo "name=S5M Agent v${release_version}" >> "$GITHUB_OUTPUT"
            echo "Stable release requested: s5m-agent-v${release_version}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release not requested::No release_version was present in the workflow_dispatch payload. This run will only build development artifacts."
          fi

      - name: Download amd64 archive
        if: steps.release_gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s5m-agent-linux-amd64
          path: dist/amd64

      - name: Download arm64 archive
        if: steps.release_gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s5m-agent-linux-arm64
          path: dist/arm64

      - name: Download RouterOS amd64 archive
        if: steps.release_gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s5m-agent-routeros-amd64
          path: dist/routeros-amd64

      - name: Download RouterOS arm64 archive
        if: steps.release_gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s5m-agent-routeros-arm64
          path: dist/routeros-arm64

      - name: Verify all four archive checksums
        if: steps.release_gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist/amd64
            sha256sum --check s5m-agent-linux-amd64.tar.sha256
          )
          (
            cd dist/arm64
            sha256sum --check s5m-agent-linux-arm64.tar.sha256
          )
          (
            cd dist/routeros-amd64
            sha256sum --check s5m-agent-routeros-amd64.tar.sha256
          )
          (
            cd dist/routeros-arm64
            sha256sum --check s5m-agent-routeros-arm64.tar.sha256
          )

          expected_files=(
            dist/amd64/s5m-agent-linux-amd64.tar
            dist/amd64/s5m-agent-linux-amd64.tar.sha256
            dist/arm64/s5m-agent-linux-arm64.tar
            dist/arm64/s5m-agent-linux-arm64.tar.sha256
            dist/routeros-amd64/s5m-agent-routeros-amd64.tar
            dist/routeros-amd64/s5m-agent-routeros-amd64.tar.sha256
            dist/routeros-arm64/s5m-agent-routeros-arm64.tar
            dist/routeros-arm64/s5m-agent-routeros-arm64.tar.sha256
          )
          for asset in "${expected_files[@]}"; do
            [[ -s "${asset}" ]] || {
              echo "::error title=Release asset missing::${asset} is missing or empty."
              exit 1
            }
          done
          actual_count="$(find dist -type f | wc -l | tr -d ' ')"
          [[ "${actual_count}" == "${#expected_files[@]}" ]] || {
            echo "::error title=Unexpected release asset count::Expected ${#expected_files[@]} files, found ${actual_count}."
            find dist -type f -print >&2
            exit 1
          }

      - name: Publish release and attach archives
        if: steps.release_gate.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_gate.outputs.name }}
          generate_release_notes: true
          make_latest: legacy
          prerelease: false
          draft: false
          # Re-running the same immutable tag replaces matching assets instead of duplicating them.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/amd64/s5m-agent-linux-amd64.tar
            dist/amd64/s5m-agent-linux-amd64.tar.sha256
            dist/arm64/s5m-agent-linux-arm64.tar
            dist/arm64/s5m-agent-linux-arm64.tar.sha256
            dist/routeros-amd64/s5m-agent-routeros-amd64.tar
            dist/routeros-amd64/s5m-agent-routeros-amd64.tar.sha256
            dist/routeros-arm64/s5m-agent-routeros-arm64.tar
            dist/routeros-arm64/s5m-agent-routeros-arm64.tar.sha256
