name: S5M Agent multi-arch images

on:
  push:
    branches: [main, dev]
    tags: ["s5m-agent-v*"]
  pull_request:
    branches: [main, dev]
    paths:
      - "s5m-agent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agent-images.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Stable release version (for example 1.0.0). Leave empty for a dev build only."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  IMAGE_NAME: ghcr.io/tony855/s5m-agent

jobs:
  build-and-publish:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          release_version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == s5m-agent-v* ]]; then
            release_version="${GITHUB_REF_NAME#s5m-agent-v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${RELEASE_VERSION_INPUT}" ]]; then
            release_version="${RELEASE_VERSION_INPUT}"
            if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release_version must use semantic version X.Y.Z (for example 1.0.0)" >&2
              exit 1
            fi
          fi

          {
            echo "tags<<EOF"
            if [[ -n "${release_version}" ]]; then
              echo "${IMAGE_NAME}:v${release_version}"
              echo "${IMAGE_NAME}:latest"
            else
              echo "${IMAGE_NAME}:dev"
            fi
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "EOF"
            echo "release_version=${release_version}" 
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image for archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: s5m-agent:amd64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64 image
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          timeout 30s docker run --rm --entrypoint /bin/sh s5m-agent:amd64-test -c 'test -x /app/s5m-agent && test -x /usr/local/bin/mihomo && test -x /healthcheck.sh && test -x /sbin/tini && /sbin/tini --version && /usr/local/bin/mihomo -v'

      - name: Test machine ID fallback inside amd64 image
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          workdir="$(mktemp -d)"
          chmod 0777 "$workdir"
          docker run --rm --entrypoint /bin/sh -v "$workdir:/data" s5m-agent:amd64-test -c '
            test -x /app/s5m-agent
            test -d /data
            test ! -e /data/machine-id
            # Runtime persistence behavior is covered by Go tests; this verifies
            # the final image includes the data directory and agent binary.
          '

      - name: Test machine ID fallback inside amd64 image
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          testdata="$(mktemp -d)"
          docker run --rm --entrypoint /bin/sh -v "$testdata:/data" s5m-agent:amd64-test -c '
            test -x /app/s5m-agent
            test ! -e /data/machine-id
            /app/s5m-agent --help >/dev/null 2>&1 || true
            test -d /data
          '

      - name: Export amd64 archive
        run: |
          mkdir -p dist
          docker save s5m-agent:amd64-test -o dist/s5m-agent-linux-amd64.tar
          sha256sum dist/s5m-agent-linux-amd64.tar > dist/s5m-agent-linux-amd64.tar.sha256

      - name: Upload amd64 archive
        uses: actions/upload-artifact@v4
        with:
          name: s5m-agent-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  build-arm64-archive:
    name: Build ARM64 RouterOS archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: linux/arm64
          load: true
          tags: s5m-agent:arm64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate ARM64 image contents
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh s5m-agent:arm64-test -c 'test -x /app/s5m-agent && test -x /usr/local/bin/mihomo && test -x /healthcheck.sh && test -x /sbin/tini && /sbin/tini --version && /usr/local/bin/mihomo -v'

      - name: Export ARM64 archive
        run: |
          mkdir -p dist
          docker save s5m-agent:arm64-test -o dist/s5m-agent-linux-arm64.tar
          sha256sum dist/s5m-agent-linux-arm64.tar > dist/s5m-agent-linux-arm64.tar.sha256

      - name: Upload ARM64 archive
        uses: actions/upload-artifact@v4
        with:
          name: s5m-agent-linux-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish-github-release:
    name: Publish stable GitHub Release
    if: startsWith(github.ref, 'refs/tags/s5m-agent-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [build-and-publish, build-arm64-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download amd64 archive
        uses: actions/download-artifact@v4
        with:
          name: s5m-agent-linux-amd64
          path: dist/amd64

      - name: Download arm64 archive
        uses: actions/download-artifact@v4
        with:
          name: s5m-agent-linux-arm64
          path: dist/arm64

      - name: Publish release and attach archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/s5m-agent-v') && github.ref_name || format('s5m-agent-v{0}', inputs.release_version) }}
          target_commitish: ${{ github.sha }}
          name: S5M Agent ${{ startsWith(github.ref, 'refs/tags/s5m-agent-v') && github.ref_name || format('v{0}', inputs.release_version) }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/amd64/s5m-agent-linux-amd64.tar
            dist/amd64/s5m-agent-linux-amd64.tar.sha256
            dist/arm64/s5m-agent-linux-arm64.tar
            dist/arm64/s5m-agent-linux-arm64.tar.sha256
