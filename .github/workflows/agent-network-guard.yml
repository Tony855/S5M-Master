name: Agent network isolation guard

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-isolation:
    name: Verify Agent stays off host networking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check Compose and deployment networking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          compose_path = Path("s5m-agent/docker-compose.yml")
          compose = compose_path.read_text(encoding="utf-8")
          active_lines = [
              line.split("#", 1)[0].rstrip()
              for line in compose.splitlines()
          ]
          host_network = re.compile(
              r"^\\s*network_mode\\s*:\\s*['\\\"]?host['\\\"]?\\s*$"
          )
          matches = [
              f"{compose_path}:{number}: {line.strip()}"
              for number, line in enumerate(active_lines, 1)
              if host_network.search(line)
          ]
          if matches:
              raise SystemExit(
                  "FAIL: Agent Compose must not use host networking:\\n"
                  + "\\n".join(matches)
              )

          deploy_path = Path("scripts/s5m-deploy.sh")
          deploy = deploy_path.read_text(encoding="utf-8")
          start = deploy.find("docker run -d")
          if start < 0:
              raise SystemExit("FAIL: deployment script has no docker run command")
          end = deploy.find('|| die "容器启动失败"', start)
          run_block = deploy[start:end if end >= 0 else len(deploy)]
          if re.search(r"(^|\\s)--network(?:=|\\s+)host(?:\\s|$)", run_block):
              raise SystemExit("FAIL: Agent deployment must not use --network host")

          if "--network bridge" not in run_block:
              raise SystemExit("FAIL: Agent deployment must explicitly use bridge networking")

          print("PASS: Compose does not enable host networking; deployment explicitly uses bridge networking.")
          PY
