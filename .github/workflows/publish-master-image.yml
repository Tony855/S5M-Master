name: S5M Master multi-arch image

on:
  push:
    branches: [main, dev]
    tags: ["s5m-master-v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "docs"
  pull_request:
    branches: [main, dev]
    paths:
      - "source/**"
      - ".github/workflows/publish-master-image.yml"
  workflow_dispatch:

# Keep stable main/tag publications serialized so the mutable latest tag cannot race.
concurrency:
  group: s5m-master-${{ github.ref == 'refs/heads/dev' && 'dev' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tony855/s5m-master

jobs:
  test:
    name: Server tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: source/go.sum
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build server
        run: go build -trimpath -ldflags="-s -w" -o /tmp/S5M-Server .

  image-test:
    name: Build and smoke-test AMD64 image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64
          load: true
          tags: s5m-master:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root runtime and health endpoint
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          container=s5m-master-ci
          volume=s5m-master-ci-data
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" \
            -p 127.0.0.1:18081:8080 \
            -e S5M_ADMIN_USER=ci-admin \
            -e S5M_ADMIN_PASSWORD='ci-only-password-not-for-production' \
            -e S5M_JWT_SECRET='ci-only-jwt-secret-not-for-production-0123456789abcdef' \
            -v "$volume:/data" \
            s5m-master:ci-test >/dev/null

          for attempt in $(seq 1 45); do
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
            if [[ "$state" != running ]]; then
              docker logs "$container" >&2
              exit 1
            fi
            if [[ "$health" == healthy ]]; then break; fi
            sleep 2
          done

          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == healthy ]] || {
            docker logs "$container" >&2
            docker inspect --format '{{json .State.Health}}' "$container" >&2
            exit 1
          }
          runtime_user="$(docker inspect --format '{{.Config.User}}' "$container")"
          [[ "$runtime_user" == s5m ]] || {
            echo "Expected non-root runtime user s5m, got: $runtime_user" >&2
            exit 1
          }
          curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:18081/api/v1/health |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok" and d.get("database") == "ok", d'
          echo "PASS: container starts as non-root, initializes persistent SQLite, and passes HTTP health check"
      - name: Scan image for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: s5m-master:ci-test
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish AMD64 and ARM64 image to GHCR
    runs-on: ubuntu-latest
    needs: [test, image-test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/s5m-master-v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether this ref may update latest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish_latest=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            publish_latest=true
          elif [[ "$GITHUB_REF" == refs/tags/s5m-master-v* ]]; then
            current_version="${GITHUB_REF_NAME#s5m-master-v}"
            [[ "$current_version" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || {
              echo "::error::Release tag must use s5m-master-vX.Y.Z"
              exit 1
            }
            if ! remote_tags="$(git ls-remote --tags --refs origin 'refs/tags/s5m-master-v*')"; then
              echo "::error::Could not verify published release tags; refusing to move latest"
              exit 1
            fi
            highest_version="$(printf '%s\\n' "$remote_tags" |
              awk '{sub(/^refs\\/tags\\/s5m-master-v/, "", $2); if ($2 ~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) print $2}' |
              sort -V | tail -n 1)"
            if [[ -z "$highest_version" || "$(printf '%s\\n' "$current_version" "$highest_version" | sort -V | tail -n 1)" == "$current_version" ]]; then
              publish_latest=true
            fi
          fi
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"
          echo "This ref may update latest: $publish_latest"
      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=s5m-master-v(.*),group=1
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
            type=sha,format=long,prefix=sha-
      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
