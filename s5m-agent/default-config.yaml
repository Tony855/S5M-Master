mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:8088
secret: __S5M_GENERATED_SECRET__
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: false
# Safety-first first boot: do not install container routes until the operator
# has verified Docker bridge isolation and the host/controller bypass routes.
# Existing /data/config.yaml is intentionally preserved by the init script.
tun:
  enable: false
proxies: []
proxy-groups: []
rules:
  - MATCH,DIRECT
