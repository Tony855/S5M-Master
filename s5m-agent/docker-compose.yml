services:
  s5m-agent:
    image: ghcr.io/tony855/s5m-agent:dev
    container_name: s5m-agent
    restart: unless-stopped
    ports:
      - "80:80"
      - "7890:7890"
    volumes:
      - ./data:/data
    # TUN is disabled by default. Enable only on hosts that support it and
    # after configuring /dev/net/tun and NET_ADMIN appropriately.
