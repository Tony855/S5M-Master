services:
  s5m-agent:
    image: ghcr.io/tony855/s5m-agent:dev
    container_name: s5m-agent
    restart: unless-stopped
    environment:
      # Pass the host OS hostname; otherwise Docker may expose the container ID.
      S5M_HOSTNAME: ${S5M_HOSTNAME:-}
    ports:
      - "80:80"
      - "7890:7890"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
    # TUN is enabled by the default Agent config. The host must provide
    # /dev/net/tun; Docker bridge networking keeps container routes isolated.
