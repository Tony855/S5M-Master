<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S5M 节点设备注册</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 100%; max-width: 420px; border: 1px solid rgba(255,255,255,0.05); }
    .logo { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px; background: linear-gradient(135deg, #4361ee, #4cc9f0); display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: 800; color: #fff; }
    h2 { text-align: center; margin: 0 0 20px; font-size: 22px; font-weight: 600; }
    label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 13px; font-weight: 500; }
    input { width: 100%; padding: 12px 16px; margin-bottom: 20px; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: #4361ee; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, #4361ee, #4cc9f0); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #msg { text-align: center; margin-top: 16px; font-size: 13px; padding: 10px; border-radius: 6px; display: none; }
    .msg-success { background: rgba(16,185,129,0.1); color: #34d399; }
    .msg-error { background: rgba(239,68,68,0.1); color: #f87171; }
    .status { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); text-align: center; font-size: 13px; color: #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
    .dot.active { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .machine-box { display: flex; flex-direction: column; align-items: stretch; gap: 10px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
    .machine-text { font-size: 13px; color: #94a3b8; font-family: monospace; word-break: break-all; max-height: 120px; overflow-y: auto; line-height: 1.4; text-align: left; }
    .btn-copy { width: 100%; padding: 10px; font-size: 14px; background: rgba(76,201,240,0.15); color: #4cc9f0; border: 1px solid rgba(76,201,240,0.3); border-radius: 6px; cursor: pointer; white-space: nowrap; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">S5</div>
  <h2>节点设备注册</h2>
  <div class="machine-box">
    <div class="machine-text" id="machineId">获取机器码中...</div>
    <button class="btn-copy" onclick="copyMachineId()">复制</button>
  </div>
  <label>控制台服务器地址</label>
  <input type="text" id="url" placeholder="例如: http://1.2.3.4">
  <label>注册密钥</label>
  <input type="password" id="secret" placeholder="请输入 Token 绑定设备">
  <button id="btn" onclick="save()">一键绑定设备</button>
  <div id="msg"></div>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">正在检测状态...</span>
  </div>
</div>
<script>
  let currentMachineID = '';
  function fetchWithTimeout(url, options = {}, timeout = 3000) {
    return Promise.race([ fetch(url, options), new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), timeout)) ]);
  }
  window.onload = async () => {
    try {
      const idRes = await fetchWithTimeout('/api/machine-id');
      const idData = await idRes.json();
      currentMachineID = idData.machine_id || '';
      document.getElementById('machineId').innerText = currentMachineID || '获取失败';
      
      const res = await fetchWithTimeout('/api/config');
      const data = await res.json();
      if (data.central_url) document.getElementById('url').value = data.central_url;

      if (data.has_token) {
        document.getElementById('btn').innerText = '重新绑定';
        if (data.token && data.connected) {
          setStatus('', '正在向主控台验证授权...');
          try {
            const verifyRes = await fetchWithTimeout(data.central_url + '/api/v1/agent/register', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ machine_code: currentMachineID, secret: data.token })
            }, 3000);
            if (verifyRes.ok) { setStatus('active', '设备已绑定，连接正常'); }
            else { setStatus('error', '授权已失效，请重新绑定'); document.getElementById('btn').innerText = '一键绑定设备'; }
          } catch(e) { setStatus('error', '验证超时，请检查网络'); }
        } else if (data.connected) { setStatus('active', '设备已绑定'); }
        else { setStatus('error', '连接已断开，请检查网络'); }
      } else { setStatus('', '等待连接'); }
    } catch(e) { document.getElementById('machineId').innerText = '获取超时'; setStatus('error', 'Agent 后端无响应'); }
  };
  function copyMachineId() {
    if (!currentMachineID) return;
    var t = document.createElement("textarea"); t.value = currentMachineID; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); showMsg('已复制', true); setTimeout(() => document.getElementById('msg').style.display = 'none', 2000); }
    catch (err) { showMsg('复制失败，请长按选择', false); }
    document.body.removeChild(t);
  }
  function setStatus(state, text) { document.getElementById('statusDot').className = 'dot ' + state; document.getElementById('statusText').innerText = text; }
  async function save() {
    let url = document.getElementById('url').value.trim().replace(/\/$/, '');
    const secret = document.getElementById('secret').value;
    if (!url) return showMsg('请输入控制台地址', false);
    if (!/^https?:\/\//i.test(url)) { url = 'http://' + url; document.getElementById('url').value = url; }
    const btn = document.getElementById('btn'); btn.innerText = '正在绑定...'; btn.disabled = true; setStatus('', '通信中...');
    try {
      const res = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({central_url: url, secret: secret}) });
      const text = await res.text(); let data = {};
      try { data = JSON.parse(text); } catch { data = { message: text }; }
      if (!res.ok) throw new Error(data.error || data.message || '绑定失败');
      showMsg(data.message, true); btn.innerText = '重新绑定'; setStatus('active', '设备已绑定，连接正常');
      setTimeout(() => location.reload(), 1500);
    } catch (e) { showMsg(e.message, false); btn.innerText = '重试绑定'; btn.disabled = false; setStatus('error', '绑定失败'); }
  }
  function showMsg(text, isSuccess) { const msg = document.getElementById('msg'); msg.innerText = text; msg.className = isSuccess ? 'msg-success' : 'msg-error'; msg.style.display = 'block'; }
</script>
</body>
</html>
